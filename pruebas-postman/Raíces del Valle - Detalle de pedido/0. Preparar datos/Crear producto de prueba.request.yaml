$kind: http-request
url: "{{baseUrl}}/api/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Papa criolla",
      "descripcion": "Cosecha de la semana",
      "categoria": "TUBERCULOS",
      "productor": "Familia Chindoy Muchavisoy",
      "precio": 16500,
      "unidadVenta": "canastilla 3 kg",
      "stock": 86,
      "estado": "PUBLICADO",
      "imagen": "../assets/img/papacriolla.png"
    }
scripts:
  - type: afterResponse
    code: pm.test("Responde 201", function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 2000
