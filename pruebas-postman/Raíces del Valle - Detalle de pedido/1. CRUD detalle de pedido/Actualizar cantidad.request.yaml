$kind: http-request
url: "{{baseUrl}}/api/detalles-pedido/{{idDetalle}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "cantidad": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 200", function () { pm.response.to.have.status(200); });
      pm.test("Cantidad actualizada a 5", function () { pm.expect(pm.response.json().cantidad).to.eql(5); });
    language: text/javascript
order: 5000
