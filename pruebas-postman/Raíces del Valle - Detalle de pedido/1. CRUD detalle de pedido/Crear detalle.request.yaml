$kind: http-request
url: "{{baseUrl}}/api/detalles-pedido"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "idPedido": {{idPedido}},
      "idProducto": {{idProducto}},
      "cantidad": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Responde 201", function () { pm.response.to.have.status(201); });
      if (pm.response.code === 201) { pm.collectionVariables.set("idDetalle", pm.response.json().id); }
      pm.test("Subtotal = precio x cantidad", function () { const d = pm.response.json(); pm.expect(Number(d.subtotal)).to.eql(Number(d.precioUnitario) * d.cantidad); });
    language: text/javascript
order: 1000
